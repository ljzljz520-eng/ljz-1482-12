services:
  db:
    image: postgres:16-alpine
    container_name: scriptstudio-db
    environment:
      POSTGRES_USER: script
      POSTGRES_PASSWORD: script
      POSTGRES_DB: scriptstudio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U script -d scriptstudio"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - studio-net

  backend:
    build: ./backend
    container_name: scriptstudio-backend
    environment:
      DATABASE_URL: postgres://script:script@db:5432/scriptstudio
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - studio-net

  frontend:
    build: ./frontend
    container_name: scriptstudio-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - studio-net

volumes:
  pgdata:

networks:
  studio-net:
    driver: bridge
