version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: script-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: script
      POSTGRES_PASSWORD: script_pwd
      POSTGRES_DB: scriptdb
    ports:
      - "5432:5432"
    volumes:
      - script-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U script -d scriptdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - script-net

  backend:
    build: ./backend
    container_name: script-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://script:script_pwd@db:5432/scriptdb?schema=public
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      PORT: "3001"
      NODE_ENV: production
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    networks:
      - script-net

  frontend:
    build: ./frontend
    container_name: script-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - script-net

volumes:
  script-pgdata:

networks:
  script-net:
    driver: bridge
